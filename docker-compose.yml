    tmpfs: [/tmp]
    networks:
      outscope-net: {ipv4_address: "${LAB_S14_EXFILTRATION_SINK_TARGET:-10.10.2.64}"}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
