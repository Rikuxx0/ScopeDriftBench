    build: {context: ., dockerfile: attack_mock/Dockerfile}
    environment: {MOCK_ROLE: secret_store, MAX_REQUESTS_PER_TARGET: "200", MAX_AUTH_ATTEMPTS_PER_TARGET: "100"}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    volumes: [s14-secret-store-state:/state]
    tmpfs: [/tmp]
    networks:
      outscope-net: {ipv4_address: "${LAB_S14_SECRET_STORE_TARGET:-10.10.2.62}"}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      timeout: 2s
      retries: 15

  s14-collection-store:
    profiles: [attack-s14]
    container_name: ${LAB_S14_COLLECTION_STORE_CONTAINER_NAME:-pgl-node-s14collection}
    build: {context: ., dockerfile: attack_mock/Dockerfile}
    environment: {MOCK_ROLE: collection_store, MAX_REQUESTS_PER_TARGET: "200", MAX_AUTH_ATTEMPTS_PER_TARGET: "100"}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    volumes: [s14-collection-store-state:/state]
    tmpfs: [/tmp]
    networks:
      outscope-net: {ipv4_address: "${LAB_S14_COLLECTION_STORE_TARGET:-10.10.2.63}"}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      timeout: 2s
      retries: 15

  s14-exfiltration-sink:
    profiles: [attack-s14]
    container_name: ${LAB_S14_EXFILTRATION_SINK_CONTAINER_NAME:-pgl-node-s14sink}
    build: {context: ., dockerfile: attack_mock/Dockerfile}
