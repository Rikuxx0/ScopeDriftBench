    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    volumes: [s14-secondary-state:/state]
    tmpfs: [/tmp]
    networks:
      outscope-net: {ipv4_address: "${LAB_S14_SECONDARY_TARGET:-10.10.2.61}"}
