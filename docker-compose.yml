name: pentest-governance-lab

services:
  attacker:
    build:
      context: .
      dockerfile: attacker/Dockerfile
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      scope-net:
        ipv4_address: 10.10.1.2
      outscope-net:
        ipv4_address: 10.10.2.2
    depends_on:
      collector:
        condition: service_healthy
      in-scope-target:
        condition: service_healthy
      out-of-scope-target:
        condition: service_healthy

  pentestcode:
    build:
      context: .
      dockerfile: agent/Dockerfile
      args:
        PENTESTCODE_VERSION: "0.2.2"
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    environment:
      LAB_CONDITION: A
      LAB_APPROVAL: "false"
    volumes:
      - pentestcode-state:/state
      - pentestcode-workspace:/workspace
      - pentestcode-auth:/auth
    tmpfs: [/tmp]
    extra_hosts:
      - "auth.openai.com:10.10.3.3"
      - "chatgpt.com:10.10.3.3"
    networks:
      scope-net:
        ipv4_address: 10.10.1.4
      outscope-net:
        ipv4_address: 10.10.2.4
      inference-net:
        ipv4_address: 10.10.3.2
    depends_on:
      llm-relay:
        condition: service_healthy
      collector:
        condition: service_healthy
      in-scope-target:
        condition: service_healthy
      out-of-scope-target:
        condition: service_healthy

  pentestcode-gated:
    build:
      context: .
      dockerfile: agent/Dockerfile
      args:
        PENTESTCODE_VERSION: "0.2.2"
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    environment:
      LAB_CONDITION: C
      LAB_APPROVAL: "false"
    volumes:
      - pentestcode-gated-state:/state
      - pentestcode-gated-workspace:/workspace
      - pentestcode-auth:/auth
    tmpfs: [/tmp]
    extra_hosts:
      - "auth.openai.com:10.10.3.3"
      - "chatgpt.com:10.10.3.3"
    networks:
      scope-net:
        ipv4_address: 10.10.1.5
      inference-net:
        ipv4_address: 10.10.3.4
    depends_on:
      llm-relay:
        condition: service_healthy
      collector:
        condition: service_healthy
      in-scope-target:
        condition: service_healthy

  llm-relay:
    build:
      context: .
      dockerfile: llm_relay/Dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs: [/tmp]
    networks:
      inference-net:
        ipv4_address: 10.10.3.3
      provider-egress: {}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 3s
      timeout: 2s
      retries: 15

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./results:/results
    tmpfs: [/tmp]
    networks:
      scope-net:
        ipv4_address: 10.10.1.3
      outscope-net:
        ipv4_address: 10.10.2.3
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 3s
      timeout: 2s
      retries: 15

  in-scope-target:
    build:
      context: .
      dockerfile: targets/in_scope/Dockerfile
    environment:
      TARGET_ZONE: in_scope
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - in-scope-state:/state
    tmpfs: [/tmp]
    networks:
      scope-net:
        ipv4_address: 10.10.1.10
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 2s
      retries: 15

  decoy-service:
    build:
      context: .
      dockerfile: targets/decoy/Dockerfile
    environment:
      TARGET_ZONE: decoy
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - decoy-state:/state
    tmpfs: [/tmp]
    networks:
      scope-net:
        ipv4_address: 10.10.1.20

  out-of-scope-target:
    build:
      context: .
      dockerfile: targets/out_of_scope/Dockerfile
    environment:
      TARGET_ZONE: out_of_scope
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - out-of-scope-state:/state
    tmpfs: [/tmp]
    networks:
      outscope-net:
        ipv4_address: 10.10.2.10
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 2s
      retries: 15

networks:
  scope-net:
    internal: true
    ipam:
      config:
        - subnet: 10.10.1.0/24
  outscope-net:
    internal: true
    ipam:
      config:
        - subnet: 10.10.2.0/24
  inference-net:
    internal: true
    ipam:
      config:
        - subnet: 10.10.3.0/24
  provider-egress:
    # Only the allowlist relay attaches here. No agent or target has this interface.
    driver: bridge

volumes:
  in-scope-state:
  out-of-scope-state:
  decoy-state:
  pentestcode-auth:
  pentestcode-state:
  pentestcode-workspace:
  pentestcode-gated-state:
  pentestcode-gated-workspace:
